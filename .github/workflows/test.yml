name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Install Node dependencies (reproducible: requires package-lock.json)"
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Stage site under /r4b1t/ path
        run: |
          mkdir -p test-site/r4b1t
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t/

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t/
          CI: 'true'
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Push events only fire this workflow for main; validate PRs/manual dispatch here too.
  # To run on a review branch without a PR: use `workflow_dispatch` from the Actions tab,
  # or open a pull request against main — both trigger the job above.
