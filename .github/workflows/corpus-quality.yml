name: Corpus Quality

on:
  pull_request:
    paths:
      - 'urls.txt'
      - 'tools/corpus_health.py'
      - 'tests/test_corpus_health.py'
      - '.github/corpus-policy.json'
      - '.github/workflows/corpus-quality.yml'
  push:
    branches: [main]
    paths:
      - 'urls.txt'
      - 'tools/corpus_health.py'
      - 'tests/test_corpus_health.py'
      - '.github/corpus-policy.json'
      - '.github/workflows/corpus-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-pool-sweep.txt

      - name: Syntax check
        run: python -m compileall -q tools/corpus_health.py tests/test_corpus_health.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_corpus_health.py' -v

      - name: Generate deterministic corpus evidence
        run: |
          python tools/corpus_health.py \
            --input urls.txt \
            --json corpus-health.json \
            --markdown corpus-health.md

      - name: Publish job summary
        run: cat corpus-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-health-${{ github.sha }}
          path: |
            corpus-health.json
            corpus-health.md
          if-no-files-found: error
          retention-days: 30
