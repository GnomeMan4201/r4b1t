name: Apply audited r4b1t release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    if: github.head_ref == 'agent/r4b1t-v1.1.0-release' || github.ref_name == 'agent/r4b1t-v1.1.0-release'
    runs-on: ubuntu-latest

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/r4b1t-v1.1.0-release
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Reconstruct and verify audited payload
        shell: bash
        run: |
          set -euo pipefail

          URLS_BEFORE=$(sha256sum urls.txt | awk '{print $1}')
          if [ -f stats.json ]; then
            STATS_BEFORE=$(sha256sum stats.json | awk '{print $1}')
          else
            STATS_BEFORE=ABSENT
          fi

          cat \
            .release-payload/part-00a .release-payload/part-00b .release-payload/part-00c \
            .release-payload/part-01a .release-payload/part-01b .release-payload/part-01c \
            .release-payload/part-02a .release-payload/part-02b .release-payload/part-02c \
            .release-payload/part-03a .release-payload/part-03b .release-payload/part-03c \
            .release-payload/part-04a .release-payload/part-04b .release-payload/part-04c \
            .release-payload/part-05a .release-payload/part-05b .release-payload/part-05c \
            .release-payload/part-06a .release-payload/part-06b .release-payload/part-06c \
            .release-payload/part-07a .release-payload/part-07b .release-payload/part-07c \
            | base64 --decode > /tmp/r4b1t-release.tar.xz

          echo '94a50b9b5a2ed19e2749a2662f33b1080b8b2e5505a8e1a313158dfb93fdac2a  /tmp/r4b1t-release.tar.xz' \
            | sha256sum --check

          tar -tJf /tmp/r4b1t-release.tar.xz > /tmp/release-manifest.txt

          if grep -Eq '(^|/)(urls\.txt|stats\.json)$' /tmp/release-manifest.txt; then
            echo 'Refusing payload that contains production corpus files.' >&2
            exit 1
          fi

          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/release-manifest.txt; then
            echo 'Refusing unsafe archive paths.' >&2
            exit 1
          fi

          tar -xJf /tmp/r4b1t-release.tar.xz -C .

          test "$URLS_BEFORE" = "$(sha256sum urls.txt | awk '{print $1}')"
          if [ "$STATS_BEFORE" = ABSENT ]; then
            test ! -e stats.json
          else
            test "$STATS_BEFORE" = "$(sha256sum stats.json | awk '{print $1}')"
          fi

          rm -rf .release-payload .release-bundle
          rm -f release-bundle.txt
          rm -f __temporary_test_should_not_use
          rm -f __temporary_tree_probe __temporary_tree_probe_2
          rm -f __temporary_tree_probe_3 __temporary_tree_probe_4
          rm -f .thumbnail github.md
          rm -f .github/workflows/apply-release.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          test ! -e .release-payload
          test ! -e .release-bundle
          test ! -e release-bundle.txt
          test ! -e .thumbnail
          test ! -e github.md

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          node --check tests/test-server.js
          node --check tests/e2e.spec.js
          node --check playwright.config.js
          python -m compileall -q pool_sweep.py tools
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
          python -m json.tool package-lock.json >/dev/null

      - name: Install locked dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Stage site under /r4b1t/ path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-site/r4b1t
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='test-site' \
            --exclude='playwright-report' \
            --exclude='test-results' \
            ./ test-site/r4b1t/

      - name: Run Playwright suite
        env:
          BASE_URL: http://127.0.0.1:8080/r4b1t/
          CI: 'true'
        run: npm test

      - name: Verify corpus and commit release
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- urls.txt stats.json; then
            echo 'Production corpus changed; refusing release commit.' >&2
            git diff -- urls.txt stats.json
            exit 1
          fi

          rm -rf node_modules test-site playwright-report test-results blob-report
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --name-only | grep -Eq '^(urls\.txt|stats\.json)$'; then
            echo 'Production corpus staged unexpectedly.' >&2
            exit 1
          fi

          git commit -m 'Prepare r4b1t v1.1.0 release'
          git push origin HEAD:agent/r4b1t-v1.1.0-release
