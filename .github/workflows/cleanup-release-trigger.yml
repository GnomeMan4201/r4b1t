name: Clean release validation trigger

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/r4b1t-v1.1.0-release' || github.ref_name == 'agent/r4b1t-v1.1.0-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r4b1t-v1.1.0-release
          fetch-depth: 0

      - name: Remove temporary release validation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci-release-validation
          rm -f .github/workflows/cleanup-release-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary release validation trigger'
          git push origin HEAD:agent/r4b1t-v1.1.0-release
