  <g font-family="monospace"><text x="36" y="218" fill="#aa171e" font-size="11">01</text><text x="68" y="218" fill="#151515" font-size="13">github.com</text><text x="68" y="235" fill="#82776d" font-size="9">CODE · 8:24 PM</text>
  <text x="36" y="270" fill="#aa171e" font-size="11">02</text><text x="68" y="270" fill="#151515" font-size="13">docs.docker.com</text><text x="68" y="287" fill="#82776d" font-size="9">PAPER · 8:17 PM</text>
  <text x="36" y="322" fill="#aa171e" font-size="11">03</text><text x="68" y="322" fill="#151515" font-size="13">retdec.com</text><text x="68" y="339" fill="#82776d" font-size="9">RESEARCH · 8:13 PM</text>
  <text x="36" y="374" fill="#aa171e" font-size="11">04</text><text x="68" y="374" fill="#151515" font-size="13">thotcon.org</text><text x="68" y="391" fill="#82776d" font-size="9">EVENT · 8:02 PM</text></g>
