  <text x="42" y="159" fill="#171717" font-family="Arial" font-size="34" font-weight="900">4</text><text x="94" y="159" fill="#171717" font-family="Arial" font-size="34" font-weight="900">12</text><text x="174" y="159" fill="#171717" font-family="Arial" font-size="34" font-weight="900">28m</text>
