<g transform="translate(830 190)">
  <rect width="330" height="475" rx="18" fill="#111" stroke="#7f1219" stroke-width="4"/>
  <rect x="16" y="18" width="298" height="42" fill="#0b0b0b" stroke="#2d2d2d"/>
  <text x="32" y="45" fill="#eee6dc" font-family="monospace" font-size="17" font-weight="700">r4b1t</text>
  <text x="246" y="45" fill="#9f958a" font-family="monospace" font-size="12">FILTER</text>
  <rect x="16" y="70" width="298" height="340" fill="#eee5d7"/>
  <text x="32" y="101" fill="#8f151c" font-family="monospace" font-size="11">03 / FIELD ACCESS</text>
  <text x="32" y="141" fill="#161616" font-family="Arial" font-size="27" font-weight="900">NARROW THE GROUND.</text>
  <text x="32" y="174" fill="#d71920" font-family="Arial" font-size="27" font-weight="900">CHANCE STILL</text>
  <text x="32" y="205" fill="#d71920" font-family="Arial" font-size="27" font-weight="900">PICKS THE ROUTE.</text>
  <text x="32" y="230" fill="#6b625a" font-family="Arial" font-size="11">Select terrain to limit the eligible corpus.</text>
  <text x="32" y="247" fill="#6b625a" font-family="Arial" font-size="11">No ranking. No personalization.</text>
  <rect x="32" y="266" width="266" height="36" fill="#d71920"/><text x="44" y="289" fill="#fff" font-family="monospace" font-size="12">WHOLE CORPUS</text><text x="240" y="289" fill="#fff" font-family="monospace" font-size="12">50,109</text>
