  <rect x="16" y="18" width="288" height="42" fill="#0b0b0b" stroke="#2d2d2d"/>
  <text x="32" y="45" fill="#eee6dc" font-family="monospace" font-size="17" font-weight="700">r4b1t</text>
  <text x="210" y="45" fill="#9f958a" font-family="monospace" font-size="12">LOCAL LEDGER</text>
  <rect x="16" y="70" width="288" height="340" fill="#eee5d7"/>
  <rect x="32" y="90" width="112" height="28" fill="#d71920"/><text x="47" y="109" fill="#fff" font-family="monospace" font-size="11">THIS SESSION</text>
