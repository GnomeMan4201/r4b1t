  <text x="34" y="125" fill="#f0e7da" font-family="Arial" font-size="29" font-weight="900">NOT SEARCH.</text>
  <text x="34" y="160" fill="#f0e7da" font-family="Arial" font-size="29" font-weight="900">NOT A FEED.</text>
  <text x="34" y="205" fill="#d71920" font-family="Arial" font-size="34" font-weight="900">DOWN THE</text>
  <text x="34" y="244" fill="#d71920" font-family="Arial" font-size="34" font-weight="900">RABBIT HOLE.</text>
  <line x1="34" y1="267" x2="282" y2="267" stroke="#6f1118"/>
  <text x="34" y="293" fill="#b5aaa0" font-family="Arial" font-size="13">A chance-driven discovery instrument</text>
  <text x="34" y="312" fill="#b5aaa0" font-family="Arial" font-size="13">across security, OSINT, research,</text>
  <text x="34" y="331" fill="#b5aaa0" font-family="Arial" font-size="13">development, and the weird web.</text>
  <rect x="34" y="356" width="248" height="42" fill="#d71920"/>
  <text x="50" y="383" fill="#fff4e8" font-family="monospace" font-size="18" font-weight="700">ROLL                    ↓</text>
  <text x="34" y="436" fill="#968c82" font-family="monospace" font-size="11">CHANCE CHOOSES</text>
</g>

