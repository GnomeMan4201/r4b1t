    <text x="44" y="324">CODE</text><text x="240" y="324">29,062</text>
    <text x="44" y="348">BLOG</text><text x="240" y="348">64</text>
    <text x="44" y="372">PAPER</text><text x="240" y="372">183</text>
    <text x="44" y="396">BOUNTY</text><text x="240" y="396">27</text>
  </g>
</g>

