<!-- captions -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="718" fill="#d71920" font-size="18" font-weight="900">01</text><text x="108" y="718" fill="#f2eadf" font-size="22" font-weight="900">FIRST CONTACT</text>
  <text x="70" y="748" fill="#b3a99f" font-size="15">Explains the tool before instrumentation takes over.</text><text x="70" y="770" fill="#b3a99f" font-size="15">No account. No profile. Just a roll.</text>
  <text x="450" y="718" fill="#d71920" font-size="18" font-weight="900">02</text><text x="488" y="718" fill="#f2eadf" font-size="22" font-weight="900">ROUTE + SPROUT</text>
  <text x="450" y="748" fill="#b3a99f" font-size="15">Follow, reject, or branch deeper, sideways, opposite,</text><text x="450" y="770" fill="#b3a99f" font-size="15">or weird. Chance picks from the corpus.</text>
  <text x="830" y="718" fill="#d71920" font-size="18" font-weight="900">03</text><text x="868" y="718" fill="#f2eadf" font-size="22" font-weight="900">TERRAIN LOCK</text>
  <text x="830" y="748" fill="#b3a99f" font-size="15">Narrow the eligible ground without changing how</text><text x="830" y="770" fill="#b3a99f" font-size="15">results are chosen. Same engine. Same chance.</text>
  <text x="1210" y="718" fill="#d71920" font-size="18" font-weight="900">04</text><text x="1248" y="718" fill="#f2eadf" font-size="22" font-weight="900">LOCAL LEDGER</text>
  <text x="1210" y="748" fill="#b3a99f" font-size="15">Preserve the trail on this device with session-local</text><text x="1210" y="770" fill="#b3a99f" font-size="15">history, route memory, and quick return.</text>
</g>
<line x1="70" y1="820" x2="1530" y2="820" stroke="#3a3030"/>
<text x="70" y="852" fill="#cfc5ba" font-family="monospace" font-size="14" letter-spacing="1">ONE ENGINE / ONE CORPUS / ONE MOBILE SHELL</text>
<text x="645" y="852" fill="#8e847b" font-family="monospace" font-size="14">VIEWPORT-SELECTED INTERFACE</text>
<text x="1045" y="852" fill="#8e847b" font-family="monospace" font-size="14">NO PROFILE OR RANKING MODEL</text>
<text x="1530" y="852" fill="#d71920" font-family="monospace" font-size="14" text-anchor="end">CURIOSITY LEAVES A TRAIL.</text>
</svg>