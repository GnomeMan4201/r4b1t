<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Field Reel / Mobile Shell</title>
<desc id="desc">Four views into the r4b1t mobile shell: first contact, route and sprout, terrain lock, and local ledger.</desc>
<rect width="1600" height="900" fill="#090909"/>
<rect x="0" y="0" width="1600" height="10" fill="#d71920"/>
<text x="70" y="88" fill="#f2eadf" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="900" letter-spacing="-2">FIELD REEL / MOBILE SHELL</text>
<text x="72" y="126" fill="#a79d92" font-family="monospace" font-size="16" letter-spacing="2">ONE ENGINE · ONE CORPUS · FOUR VIEWS INTO THE DESCENT</text>
<line x1="70" y1="150" x2="1530" y2="150" stroke="#d71920" stroke-width="3"/>
<text x="1250" y="72" fill="#e9e1d5" font-family="Arial" font-size="20" font-weight="800">NOT SEARCH.</text>
<text x="1250" y="98" fill="#e9e1d5" font-family="Arial" font-size="20" font-weight="800">NOT A FEED.</text>
<text x="1250" y="124" fill="#d71920" font-family="Arial" font-size="20" font-weight="900">DOWN THE RABBIT HOLE.</text>

