  <path d="M165 303 C165 330 78 331 78 362 M165 303 C165 330 128 332 128 362 M165 303 C165 330 203 332 203 362 M165 303 C165 330 252 331 252 362" fill="none" stroke="#d71920" stroke-width="4"/>
  <circle cx="78" cy="366" r="7" fill="#d71920"/><circle cx="128" cy="366" r="7" fill="#d71920"/><circle cx="203" cy="366" r="7" fill="#d71920"/><circle cx="252" cy="366" r="7" fill="#d71920"/>
  <text x="52" y="392" fill="#292929" font-family="monospace" font-size="10">DEEPER</text><text x="104" y="392" fill="#292929" font-family="monospace" font-size="10">SIDEWAYS</text><text x="177" y="392" fill="#292929" font-family="monospace" font-size="10">OPPOSITE</text><text x="235" y="392" fill="#292929" font-family="monospace" font-size="10">WEIRD</text>
