<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The mechanism, without the mystique</title>
<desc id="desc">r4b1t explained as corpus, chance, route, branch, terrain, trail, and privacy model.</desc>
<rect width="1600" height="900" fill="#eee5d7"/>
<rect x="0" y="0" width="1600" height="10" fill="#d71920"/>
<text x="64" y="74" fill="#a0161e" font-family="monospace" font-size="26" font-weight="700">r4b1t</text>
<text x="64" y="106" fill="#6e655c" font-family="monospace" font-size="13">NOT SEARCH. NOT A FEED. DOWN THE RABBIT HOLE.</text>
<text x="365" y="82" fill="#151515" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="900" letter-spacing="-2">THE MECHANISM,</text>
<text x="365" y="138" fill="#d71920" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="900" letter-spacing="-2">WITHOUT THE MYSTIQUE.</text>
<text x="368" y="172" fill="#766c63" font-family="monospace" font-size="15" letter-spacing="1">CORPUS → CHANCE → ROUTE → BRANCH → DEVICE-LOCAL TRAIL</text>
<line x1="64" y1="196" x2="1534" y2="196" stroke="#b9aea2" stroke-width="2"/>

<!-- compact rabbit mark -->
<g transform="translate(1335 26)">
  <path d="M42 80 C30 25 38 5 55 18 L82 98Z" fill="#181818" stroke="#d71920" stroke-width="5"/>
  <path d="M112 97 L138 18 C153 2 164 18 154 78Z" fill="#181818" stroke="#d71920" stroke-width="5"/>
  <path d="M33 142 C40 95 73 77 103 78 C138 79 164 104 166 144 L148 188 L51 188Z" fill="#111" stroke="#d71920" stroke-width="5"/>
  <ellipse cx="101" cy="128" rx="44" ry="38" fill="#f2eadf"/>
  <path d="M70 126 L92 130 L82 140 L68 136Z" fill="#d71920"/><path d="M110 130 L133 125 L136 136 L121 141Z" fill="#d71920"/>
</g>
<text x="1532" y="155" fill="#5f574f" font-family="monospace" font-size="13" text-anchor="end">SAME INTERNET. DIFFERENT ANGLE.</text>

<!-- panel 1 -->
<g transform="translate(64 230)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">01</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">CORPUS / EVIDENCE</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">THE BASELINE POOL</text>
  <text x="18" y="76" fill="#171717" font-family="Arial" font-size="18" font-weight="800">50,109 valid URLs / 12,396 unique hosts</text>
  <text x="18" y="104" fill="#6c6258" font-family="Arial" font-size="13">A frozen structural baseline with bounded claims.</text>
  <text x="18" y="139" fill="#a0161e" font-family="Arial" font-size="13" font-weight="800">STRUCTURAL VALIDITY</text>
  <text x="18" y="159" fill="#514941" font-family="Arial" font-size="12">No invalid, exact-duplicate, or credential-bearing entries admitted.</text>
  <text x="18" y="190" fill="#a0161e" font-family="Arial" font-size="13" font-weight="800">BOUNDARY</text>
  <text x="18" y="210" fill="#514941" font-family="Arial" font-size="12">Validity ≠ current liveness, safety, relevance, truth, or content integrity.</text>
</g>

<!-- panel 2 -->
<g transform="translate(565 230)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">02</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">ROUTE CARD</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">WHAT A ROLL SHOWS</text>
  <text x="18" y="82" fill="#b01920" font-family="monospace" font-size="12">https://</text>
  <text x="18" y="116" fill="#111" font-family="Arial" font-size="32" font-weight="900">GITHUB.COM</text>
  <text x="18" y="142" fill="#6d635a" font-family="Arial" font-size="12">One eligible item from the corpus. No ranking. No personalization.</text>
  <g font-family="Arial" font-size="12"><text x="18" y="176" fill="#a0161e" font-weight="800">SEE</text><text x="74" y="176" fill="#4e4740">title, host, URL, category, metadata</text><text x="18" y="198" fill="#a0161e" font-weight="800">FOLLOW</text><text x="74" y="198" fill="#4e4740">open the route and go outward</text><text x="18" y="220" fill="#a0161e" font-weight="800">REJECT</text><text x="74" y="220" fill="#4e4740">roll again without tuning a profile</text></g>
</g>

<!-- panel 3 -->
<g transform="translate(1066 230)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">03</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">BRANCH / SPROUT</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">FOUR WAYS TO GO</text>
  <path d="M235 76 C235 108 74 108 74 145 M235 76 C235 108 170 108 170 145 M235 76 C235 108 300 108 300 145 M235 76 C235 108 397 108 397 145" fill="none" stroke="#d71920" stroke-width="4"/>
  <g fill="#d71920"><circle cx="74" cy="149" r="7"/><circle cx="170" cy="149" r="7"/><circle cx="300" cy="149" r="7"/><circle cx="397" cy="149" r="7"/></g>
  <g font-family="monospace" font-size="11" fill="#222" text-anchor="middle"><text x="74" y="173">DEEPER</text><text x="170" y="173">SIDEWAYS</text><text x="300" y="173">OPPOSITE</text><text x="397" y="173">WEIRD</text></g>
  <text x="18" y="205" fill="#504941" font-family="Arial" font-size="12">Directional pivots use corpus context; labels guide navigation,</text>
  <text x="18" y="223" fill="#504941" font-family="Arial" font-size="12">not a hidden engagement or recommendation score.</text>
</g>

<!-- panel 4 -->
<g transform="translate(64 510)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">04</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">TERRAIN FILTER</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">CONSTRAIN THE GROUND</text>
  <rect x="18" y="64" width="190" height="158" fill="#161616"/>
  <rect x="28" y="78" width="170" height="29" fill="#d71920"/><text x="40" y="98" fill="#fff" font-family="monospace" font-size="11">WHOLE CORPUS</text>
  <g fill="#dfd6ca" font-family="monospace" font-size="11"><text x="40" y="128">CODE      29,062</text><text x="40" y="151">BLOG          64</text><text x="40" y="174">PAPER        183</text><text x="40" y="197">BOUNTY        27</text></g>
  <text x="232" y="85" fill="#171717" font-family="Arial" font-size="18" font-weight="800">Filter eligibility, not priority.</text>
  <text x="232" y="116" fill="#5b534b" font-family="Arial" font-size="12">Choose a terrain to narrow what can appear.</text>
  <text x="232" y="142" fill="#a0161e" font-family="Arial" font-size="12" font-weight="800">NO RANKING</text>
  <text x="232" y="161" fill="#5b534b" font-family="Arial" font-size="12">Chance still chooses inside the filtered set.</text>
  <text x="232" y="188" fill="#a0161e" font-family="Arial" font-size="12" font-weight="800">SAME MECHANISM</text>
  <text x="232" y="207" fill="#5b534b" font-family="Arial" font-size="12">Filtering changes what can appear, not what should.</text>
</g>

<!-- panel 5 -->
<g transform="translate(565 510)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">05</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">TRAIL / HISTORY</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">THE ROUTE YOU MADE</text>
  <text x="18" y="78" fill="#171717" font-family="Arial" font-size="18" font-weight="800">A device-local record of exploration.</text>
  <g font-family="Arial" font-size="12"><text x="18" y="112" fill="#a0161e" font-weight="800">DEVICE-LOCAL</text><text x="132" y="112" fill="#514941">session/trail state stays in your browser</text><text x="18" y="142" fill="#a0161e" font-weight="800">YOUR ROUTE</text><text x="132" y="142" fill="#514941">see what appeared and where you branched</text><text x="18" y="172" fill="#a0161e" font-weight="800">PICK UP LATER</text><text x="132" y="172" fill="#514941">return to useful stops without a feed profile</text><text x="18" y="202" fill="#a0161e" font-weight="800">VERIFIABLE</text><text x="132" y="202" fill="#514941">export content-addressed trail material</text></g>
</g>

<!-- panel 6 -->
<g transform="translate(1066 510)">
  <rect width="470" height="250" fill="#f7f0e6" stroke="#c6b9ac"/>
  <rect width="470" height="42" fill="#111"/>
  <text x="16" y="28" fill="#d71920" font-family="monospace" font-size="17" font-weight="700">06</text><text x="54" y="28" fill="#f3eadf" font-family="Arial" font-size="18" font-weight="800">PRIVACY MODEL</text><text x="452" y="28" fill="#958a7f" font-family="monospace" font-size="11" text-anchor="end">BUILT FOR CURIOSITY</text>
  <rect x="18" y="65" width="176" height="158" fill="#190d0f"/>
  <text x="34" y="100" fill="#f0e8dd" font-family="Arial" font-size="20" font-weight="900">NO PROFILE</text>
  <text x="34" y="134" fill="#f0e8dd" font-family="Arial" font-size="20" font-weight="900">NO RANKING</text>
  <text x="34" y="168" fill="#d71920" font-family="Arial" font-size="20" font-weight="900">DEVICE-LOCAL</text>
  <text x="34" y="202" fill="#7f756c" font-family="monospace" font-size="10">SESSION STATE</text>
  <text x="220" y="91" fill="#171717" font-family="Arial" font-size="17" font-weight="800">Protect curiosity from profiling.</text>
  <text x="220" y="121" fill="#5b534b" font-family="Arial" font-size="12">No account is required to explore.</text>
  <text x="220" y="146" fill="#5b534b" font-family="Arial" font-size="12">No recommendation profile ranks routes.</text>
  <text x="220" y="171" fill="#5b534b" font-family="Arial" font-size="12">Local state does not make external browsing anonymous.</text>
  <text x="220" y="196" fill="#5b534b" font-family="Arial" font-size="12">Third-party sites keep their own logging and policies.</text>
</g>

<line x1="64" y1="804" x2="1536" y2="804" stroke="#b8ada0"/>
<text x="64" y="840" fill="#6f655c" font-family="monospace" font-size="14">r4b1t / OPEN INTERNET EXPLORATION</text>
<text x="1536" y="840" fill="#a0161e" font-family="monospace" font-size="14" text-anchor="end">SAME INTERNET. DIFFERENT ANGLE.</text>
</svg>